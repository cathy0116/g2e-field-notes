<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>回國整理｜展場遊戲資料庫</title><link rel="stylesheet" href="return.css"><script defer src="jszip.min.js"></script><script type="module" src="return-app.js"></script></head><body><header><div><strong>展場遊戲資料庫</strong><small>出差筆記 · 電腦整理</small></div><a class="button" href="index.html#more">回 App</a></header><main><h1>把備份整理成報告</h1><p class="muted">選取完整 JSON，預覽後下載 Excel、圖文網頁與附件。檔案只在本頁處理，不會上傳。</p><section aria-labelledby="import-title"><h2 id="import-title">匯入你的備份</h2><label class="file-label" for="files">選擇 JSON 備份（可多選）</label><input id="files" type="file" accept=".json,application/json" multiple><p class="muted"><small>最多 20 份、合計 150 MB。關閉或重新整理頁面後，需重新匯入。</small></p><p id="status" role="status" aria-live="polite">尚未選擇檔案。</p><div id="sources"></div></section><section id="workspace" hidden><div class="toolbar"><label>搜尋<input id="search" type="search" placeholder="遊戲、廠商、筆記或紀錄者"></label><label>類別<select id="category"><option value="">全部</option><option>機台</option><option>賭場</option></select></label><button id="export" class="primary">下載整理包 ZIP</button><button id="clear">清空本頁</button></div><p id="summary"></p><p class="muted"><small>匯出包含所有勾選來源，不受搜尋篩選影響。尚未上網查證；跨檔紀錄分開保留。</small></p><div id="warnings"></div><div id="records"></div><button id="more" hidden>顯示更多紀錄</button></section><footer>v1.0.0 · 建議用電腦。<a href="G2E-Return-Workflow-SOP-v2.pdf" target="_blank" rel="noopener">回國整理 SOP</a> · <a href="G2E-App-Quick-Guide-v2.6.pdf" target="_blank" rel="noopener">App 使用教學</a></footer></main></body></html>
